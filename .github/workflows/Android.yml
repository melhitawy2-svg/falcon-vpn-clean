name: Falcon VPN Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Falcon VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and verify Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FalconVPN-Android-Clean-Start.zip"

          echo "=== Checking ZIP file ==="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root"
            ls -la
            exit 1
          fi

          echo "=== Extracting project ==="

          rm -rf project
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          echo "=== Locating Gradle project ==="

          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Found project at: $PROJECT_ROOT"

          if [ "$PROJECT_ROOT" != "project" ]; then
            cp -a "$PROJECT_ROOT"/. project/
          fi

          echo "=== Verifying required files ==="

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: project/settings.gradle.kts missing"
            exit 1
          fi

          if [ ! -f project/build.gradle.kts ]; then
            echo "ERROR: project/build.gradle.kts missing"
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: project/app/build.gradle.kts missing"
            exit 1
          fi

          echo "=== Project structure ==="
          ls -la project
          ls -la project/app

          echo "SUCCESS: Project files verified"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated"
            find project/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "SUCCESS: APK generated"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
